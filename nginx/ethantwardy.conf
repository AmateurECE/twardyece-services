server {
    listen 80;
    listen [::]:80;
    server_name ethantwardy.com www.ethantwardy.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name static.ethantwardy.com;

    location / {
        root /srv;
        autoindex on;
        allow all;
    }
}
