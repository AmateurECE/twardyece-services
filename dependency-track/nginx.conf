upstream dependencytrack-apiserver {
  keepalive 32;
  server public_dependency-track-api:8080;
}

upstream dependencytrack-frontend {
  keepalive 32;
  server public_dependency-track-frontend:8080;
}

server {
  listen 80;
  listen [::]:80;
  server_name dt.ethantwardy.com;

  location /api/ {
    proxy_pass http://dependencytrack-apiserver;
    proxy_read_timeout 90;
    proxy_connect_timeout 90;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass http://dependencytrack-frontend;
    proxy_read_timeout 90;
    proxy_connect_timeout 90;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
